<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日新闻简报 📰</title>
<!-- 样式表带版本参数 ?v=：改动 CSS 后版本号一变，浏览器就会重新下载，
     不会再拿旧的缓存。
     这里刻意写成占位符 __BUILD__：磁盘上的文件永远是它，
     由 start-server.ps1 在"发给浏览器那一刻"替换成当天日期（如 20261018），
     源文件因此不会被改动、git 工作区始终是干净的。
     详细说明见下方脚本注释 -->
<link rel="stylesheet" href="css/style.css?v=__BUILD__">
</head>
<body>
<div class="app">

  <!-- ===== 页头 ===== -->
  <header class="header">
    <span class="news-logo">📰</span>
    <h1>每日新闻简报</h1>
    <p class="date" id="dateText"></p>
    <button class="btn-generate" id="btnGenerate">生成今日简报</button>

    <!-- 视图切换开关（阶段 4 的正式开关，取代了阶段 1 的临时预览按钮）
         生成简报前隐藏；生成后可用，在「列表浏览」和「沉浸浏览」之间一键切换。
         选中的模式会记住（存在浏览器本地），下次生成简报自动沿用 -->
    <div class="view-switch hidden" id="viewSwitch">
      <button class="vs-btn active" id="btnViewList" data-view="list">📋 列表浏览</button>
      <button class="vs-btn" id="btnViewImmersive" data-view="immersive">📱 沉浸浏览</button>
    </div>
  </header>

  <!-- ===== 加载中提示（默认隐藏） ===== -->
  <div class="loading hidden" id="loading">
    <span class="spinner"></span>
    正在抓取最新新闻，请稍候…
  </div>

  <!-- ===== 简报区域（初始为空，由 js/app.js 填充内容） ===== -->
  <main class="briefing hidden" id="briefing">

    <!-- 政治分类（2026-10-18 新增：权威官方媒体，中新网） -->
    <section class="category" id="cat-政治">
      <h2><span class="cat-icon">🏛️</span> 政治</h2>
      <div class="news-list"></div>
    </section>

    <!-- 科技分类 -->
    <section class="category" id="cat-科技">
      <h2><span class="cat-icon">💻</span> 科技</h2>
      <div class="news-list"></div>
    </section>

    <!-- 财经分类 -->
    <section class="category" id="cat-财经">
      <h2><span class="cat-icon">💰</span> 财经</h2>
      <div class="news-list"></div>
    </section>

    <!-- 生活分类 -->
    <section class="category" id="cat-生活">
      <h2><span class="cat-icon">🌿</span> 生活</h2>
      <div class="news-list"></div>
    </section>

  </main>

  <!-- ===== 空状态提示（还没生成时的默认画面） ===== -->
  <div class="empty" id="empty">
    <div class="empty-icon">🗞️</div>
    <p>点击上方按钮，生成属于你的今日新闻简报</p>
    <p class="empty-tip">共 6 个免费 RSS 源 · 全部来自权威官方媒体 · 分四个板块展示 · 支持列表/沉浸两种浏览方式</p>
  </div>

  <!-- ===== 错误提示（默认隐藏） ===== -->
  <div class="error hidden" id="error"></div>

  <!-- ===== 历史新闻统计（默认隐藏，生成简报后由 js/stats.js 填充） ===== -->
  <section class="news-stats-card hidden" id="statsCard">
    <h2>📈 历史新闻统计（近 7 天）</h2>
    <div class="stats-summary" id="statsSummary"></div>
    <div class="stats-legend">
      <span><i class="dot" style="background:#3b82f6"></i>科技</span>
      <span><i class="dot" style="background:#f59e0b"></i>财经</span>
      <span><i class="dot" style="background:#ec4899"></i>生活</span>
    </div>
    <div class="stats-bars" id="statsBars"></div>
    <div class="stats-table-wrap">
      <table class="news-stats-table">
        <thead>
          <tr>
            <th>日期</th>
            <th>政治</th>
            <th>科技</th>
            <th>财经</th>
            <th>生活</th>
            <th>合计</th>
          </tr>
        </thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>
  </section>

  <footer>数据来自公开 RSS 源，仅供个人学习使用</footer>
</div>

<!-- ============================================================
     沉浸浏览视图（抖音式竖屏全屏卡片）
     阶段 1：只做「卡片布局」，默认隐藏。
     阶段 2 会加上下翻页、阶段 4 会加正式的视图切换开关。
     结构说明：
       .immersive   → 铺满整个屏幕的灰色遮罩层
       .imm-stage   → 中间的竖屏"手机框"（电脑上是居中卡片，手机上就是整屏）
       .imm-card    → 单条新闻的卡片内容，由 js/app.js 填充
     ============================================================ -->
<div class="immersive hidden" id="immersiveView">
  <div class="imm-stage">

    <!-- 顶部小条：左边显示"第 N / M 条"，右边是退出按钮 -->
    <div class="imm-topbar">
      <span class="imm-counter" id="immCounter">第 1 / 1 条</span>
      <button class="imm-close" id="immClose" title="退出沉浸浏览">✕</button>
    </div>

    <!-- 打开后短暂显示的操作提示：显示 3 秒后淡出（动画总时长 4 秒，
         具体时长定义在 style.css 的 @keyframes hintFade，两边保持一致） -->
    <div class="imm-hint" id="immHint">
      <span>滚轮 / ↑ ↓ 切换 · 到最后一条自动回到第一条</span>
    </div>

    <!-- 卡片内容（标题、封面、摘要、按钮）由 js/app.js 动态填充 -->
    <div class="imm-card" id="immCard"></div>

    <!-- 底部进度条：一眼看出看到第几条了（由 js/app.js 更新宽度） -->
    <div class="imm-progress"><span id="immProgress"></span></div>

  </div>
</div>

<!-- 底部中文提示条（默认隐藏）：用于"今日暂无新闻，请稍后重试"这类提示 -->
<div class="toast hidden" id="toast"></div>

<!-- 脚本按依赖顺序引入：先工具，再配置，再统计，最后主逻辑
     summarize.js 必须放在 config.js 前面，因为配置里的摘要功能要用到它

     【?v= 版本号是怎么变的（以后不用手动 Ctrl+F5）】
     源文件里一律写占位符 ?v=__BUILD__，永远不要把它改成具体日期。

     服务器（start-server.ps1）在把本文件发给浏览器的那一刻，
     会把 __BUILD__ 替换成"当天日期"（如 20261018）再下发。
     于是：
       - 磁盘上的 index.html 永远不变 → git 工作区始终干净
       - 浏览器每天拿到的版本号自动变 → js/css 不会被旧缓存挡住
     再加上服务器对 .html/.js/.css 一律返回
       Cache-Control: no-cache，双保险，普通刷新（F5）即可看到新内容。

     注意：只有走 start-server 打开页面才有这个效果。
     直接双击 index.html（file:// 方式）没有服务器，占位符会原样保留，
     浏览器会把它当成版本号字符串用，同样能绕过缓存，不影响正常显示。 -->
<script src="js/summarize.js?v=__BUILD__"></script>
<script src="js/config.js?v=__BUILD__"></script>
<script src="js/rss.js?v=__BUILD__"></script>
<script src="js/stats.js?v=__BUILD__"></script>
<script src="js/aiImage.js?v=__BUILD__"></script>
<script src="js/app.js?v=__BUILD__"></script>
</body>
</html>
